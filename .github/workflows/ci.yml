name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write # for test report publishing

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: windows-latest
    permissions:
      contents: write # for pushing the coverage badge to the badges branch
      checks: write   # for test report publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Verify formatting (dotnet format)
        # Fails the build if any file would be reformatted. Style rules are
        # defined in .editorconfig and enforced at build time via
        # EnforceCodeStyleInBuild; this step catches whitespace/format drift.
        run: dotnet format AltTabExcluder.sln --verify-no-changes --no-restore

      - name: Build (Debug)
        run: dotnet build --no-restore -c Debug

      - name: Test with coverage
        run: >
          dotnet test --no-build -c Debug
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage"
          --settings tests/AltTabExcluder.Tests/coverlet.runsettings
          --results-directory ./coverage

      - name: Run integration tests
        # Integration tests require a live desktop session (windows-latest
        # runners run in an interactive session). They are tagged with
        # [Trait("Category","Integration")] and filtered separately from the
        # unit test / coverage run above.
        run: dotnet test --no-build -c Debug --filter "Category=Integration"

      - name: Parse coverage & enforce gates
        shell: pwsh
        run: |
          $report = Get-ChildItem -Recurse ./coverage -Filter "coverage.cobertura.xml" | Select-Object -First 1
          if ($null -eq $report) {
            Write-Host "::error::No coverage report found."
            exit 1
          }

          [xml]$xml = Get-Content $report.FullName
          $overallLine = [math]::Round([double]$xml.coverage.'line-rate' * 100, 1)
          $overallBranch = [math]::Round([double]$xml.coverage.'branch-rate' * 100, 1)
          Write-Host "Overall line coverage: $overallLine% (informational — not a gate)"
          Write-Host "Overall branch coverage: $overallBranch% (informational — not a gate)"

          # Surface the coverage strategy as a workflow notice. The overall
          # number is low because Win32/UI/entry-point code (which requires
          # a live desktop session) is excluded from unit tests; the
          # meaningful quality gate is the per-file 70% floor on each
          # testable logic layer below.
          Write-Host "::notice::Coverage strategy: the enforced quality gate is >=70% line coverage on each testable logic layer (WindowStyleMath, AppSettings, RuleEngine, ExclusionTracker, ProcessRule, AppLogger). The overall number is informational only. See the per-file table below."

          # --- Single gate: per-file >=70% on testable logic layers ---
          # These are the pure/non-Win32 files that MUST be unit-tested.
          # Win32/UI/entry-point files are excluded from coverage measurement
          # (see coverlet.runsettings) because they require a live Windows
          # desktop session. WindowManager.cs is excluded — its pure style-bit
          # math was extracted into WindowStyleMath.cs (which IS gated), and
          # the remaining Win32 interop methods are untestable without a
          # desktop session.
          $testableFiles = @(
            'WindowStyleMath.cs',
            'AppSettings.cs',
            'RuleEngine.cs',
            'ExclusionTracker.cs',
            'ProcessRule.cs',
            'AppLogger.cs'
          )
          $perFileGate = 70.0
          $failed = $false

          Write-Host ""
          Write-Host "Per-file coverage (testable layers, gate: $perFileGate%):"
          Write-Host "  File                        Line%   Status"
          Write-Host "  ----                        -----   ------"

          foreach ($target in $testableFiles) {
            $class = $xml.SelectNodes("//class") |
              Where-Object { $_.filename -notmatch "obj\\" -and $_.filename -notmatch "\.g\.cs" -and $_.filename -like "*$target" } |
              Select-Object -First 1
            if ($null -eq $class) {
              Write-Host "  $target".PadEnd(30) + "  N/A    SKIP (not found)"
              continue
            }
            $rate = [math]::Round([double]$class.'line-rate' * 100, 1)
            $status = if ($rate -ge $perFileGate) { "PASS" } else { "FAIL" }
            Write-Host ("  {0,-28} {1,5}%  {2}" -f $target, $rate, $status)
            if ($rate -lt $perFileGate) {
              $failed = $true
            }
          }

          if ($failed) {
            Write-Host ""
            Write-Host "::error::One or more testable files are below the $perFileGate% per-file gate."
            exit 1
          }
          Write-Host ""
          Write-Host "Coverage gate passed — all testable logic layers >= $perFileGate%."

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: ./coverage/**/*cobertura.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Update live coverage badge
        # Only on main pushes (not PRs) — pushes a shields.io endpoint JSON
        # to the 'badges' branch so the README badge reflects real coverage.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $report = Get-ChildItem -Recurse ./coverage -Filter "coverage.cobertura.xml" | Select-Object -First 1
          if ($null -eq $report) { Write-Host "No coverage report — skipping badge."; exit 0 }
          [xml]$xml = Get-Content $report.FullName

          # Compute the minimum per-file rate across the testable logic layers.
          $testableFiles = @('WindowStyleMath.cs','AppSettings.cs','RuleEngine.cs','ExclusionTracker.cs','ProcessRule.cs','AppLogger.cs')
          $perFileGate = 70.0
          $minRate = 100.0
          foreach ($target in $testableFiles) {
            $class = $xml.SelectNodes("//class") |
              Where-Object { $_.filename -notmatch "obj\\" -and $_.filename -notmatch "\.g\.cs" -and $_.filename -like "*$target" } |
              Select-Object -First 1
            if ($null -ne $class) {
              $rate = [math]::Round([double]$class.'line-rate' * 100, 1)
              if ($rate -lt $minRate) { $minRate = $rate }
            }
          }

          $color = if ($minRate -ge $perFileGate) { "green" } else { "red" }
          $badge = @{ schemaVersion = 1; label = "coverage"; message = "$minRate% per-file gate"; color = $color } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText("coverage.json", $badge)

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B badges
          git add coverage.json
          git commit -m "Update coverage badge [skip ci]" || echo "No changes"
          git push origin badges --force

  release-build:
    name: Release Build & Publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore (for win-x64 single-file publish)
        run: dotnet restore -r win-x64 src\AltTabExcluder\AltTabExcluder.csproj

      - name: Build (Release)
        run: dotnet build --no-restore -c Release src\AltTabExcluder\AltTabExcluder.csproj

      - name: Publish single-file
        run: dotnet publish --no-restore -c Release -p:PublishProfile=SingleFile src\AltTabExcluder\AltTabExcluder.csproj

  release:
    name: Publish GitHub Release
    # Only runs when a version tag (v*) is pushed. Builds the single-file exe
    # and attaches it to a GitHub Release so the README's "Pre-built binary"
    # link always resolves to a downloadable artifact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, release-build]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        # -p:Platform=x64 is required because building the .csproj directly
        # (not via the .sln) defaults $(Platform) to AnyCPU, which omits the
        # x64 segment from the output path.
        run: dotnet publish -c Release -p:Platform=x64 -p:PublishProfile=SingleFile src\AltTabExcluder\AltTabExcluder.csproj

      - name: Zip publish output
        shell: pwsh
        run: |
          # Find the exe dynamically in case the output path varies.
          $exe = Get-ChildItem -Recurse -Filter "AltTabExcluder.exe" -Path "src\AltTabExcluder\bin" |
            Where-Object { $_.DirectoryName -like "*publish*" } |
            Select-Object -First 1
          if ($null -eq $exe) {
            Write-Host "::error::AltTabExcluder.exe not found in publish output."
            exit 1
          }
          Write-Host "Found exe at: $($exe.FullName)"

          # Generate SHA256 checksum in coreutils format (<hash>  <filename>).
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  AltTabExcluder.exe" | Out-File -Encoding ascii "checksums.sha256"
          Write-Host "Checksum: $hash"

          # Write a plain-text README for inside the zip.
          $version = $env:GITHUB_REF_NAME
          $readmeContent = @"
          AltTabExcluder $version
          =======================

          Keep clutter out of your Alt+Tab switcher.

          A lightweight Windows system-tray utility that lets you hide any
          window from the Alt+Tab switcher — and optionally remember that
          choice so future windows from the same app are excluded
          automatically.

          QUICK START
          -----------
          Just run AltTabExcluder.exe — no installation needed.

          Press Win+Alt+X to hide the focused window from Alt+Tab.
          Press it again to restore it.

          Right-click the tray icon for Quick Exclude (pick from open
          windows), Always Exclude (persistent per-process rules), Restore
          All, and Settings (change hotkey, run at startup, etc.).

          SYSTEM REQUIREMENTS
          -------------------
          Windows 10/11 x64. No .NET installation required (self-contained).

          DATA LOCATION
          -------------
          %APPDATA%\AltTabExcluder\
            settings.json  - hotkey config + excluded-by-us tracking
            rules.json     - persistent per-process exclusion rules
            app.log        - rotating log file (256 KB max)

          VERIFY INTEGRITY
          ----------------
          The SHA256 hash of AltTabExcluder.exe is in checksums.sha256.
          Verify with PowerShell:
            (Get-FileHash AltTabExcluder.exe -Algorithm SHA256).Hash

          FULL DOCUMENTATION
          ------------------
          https://github.com/markoshaq/AltTabExcluder

          LICENSE
          -------
          MIT — see LICENSE.txt in this archive.
          "@
          $readmeContent | Out-File -Encoding utf8 "README.txt"

          # Copy the repo LICENSE into the zip as LICENSE.txt.
          Copy-Item "LICENSE" "LICENSE.txt" -ErrorAction SilentlyContinue
          if (-not (Test-Path "LICENSE.txt")) {
            # Fallback if LICENSE file is missing.
            "MIT License - see https://github.com/markoshaq/AltTabExcluder" | Out-File -Encoding utf8 "LICENSE.txt"
          }

          # Build the zip with all four files.
          $zipPath = "AltTabExcluder-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path $exe.FullName, "checksums.sha256", "README.txt", "LICENSE.txt" `
            -DestinationPath $zipPath
          Write-Host "Created $zipPath with exe, checksums, README, and LICENSE."

      - name: Create release & upload asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # Upload the zip and the standalone checksum file as release assets.
          gh release create $tag `
            "AltTabExcluder-$tag.zip" `
            "checksums.sha256" `
            --title $tag `
            --generate-notes `
            --verify-tag
