name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write # for test report publishing

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Verify formatting (dotnet format)
        # Fails the build if any file would be reformatted. Style rules are
        # defined in .editorconfig and enforced at build time via
        # EnforceCodeStyleInBuild; this step catches whitespace/format drift.
        run: dotnet format AltTabExcluder.sln --verify-no-changes --no-restore

      - name: Build (Debug)
        run: dotnet build --no-restore -c Debug

      - name: Test with coverage
        run: >
          dotnet test --no-build -c Debug
          --collect:"XPlat Code Coverage"
          --settings tests/AltTabExcluder.Tests/coverlet.runsettings
          --results-directory ./coverage

      - name: Parse coverage & enforce gates
        shell: pwsh
        run: |
          $report = Get-ChildItem -Recurse ./coverage -Filter "coverage.cobertura.xml" | Select-Object -First 1
          if ($null -eq $report) {
            Write-Host "::error::No coverage report found."
            exit 1
          }

          [xml]$xml = Get-Content $report.FullName
          $overallLine = [math]::Round([double]$xml.coverage.'line-rate' * 100, 1)
          $overallBranch = [math]::Round([double]$xml.coverage.'branch-rate' * 100, 1)
          Write-Host "Overall line coverage: $overallLine%"
          Write-Host "Overall branch coverage: $overallBranch%"

          # Surface the coverage strategy as a workflow notice so the low
          # overall number is not misread. The overall floor is intentionally
          # low because Win32/UI/entry-point code (which requires a live
          # desktop session) is excluded from unit tests; the meaningful gate
          # is the per-file 70% floor on the testable logic layers below.
          Write-Host "::notice::Coverage strategy: overall floor is a regression guard only (Win32/UI is untestable without a desktop session). The enforced quality gate is >=70% line coverage on each testable logic layer (AppSettings, RuleEngine, ExclusionTracker, ProcessRule, AppLogger). See the per-file table below."

          # --- Gate 1: Overall floor (catches total regressions) ---
          $overallGate = 10.0
          if ($overallLine -lt $overallGate) {
            Write-Host "::error::Overall line coverage $overallLine% is below the $overallGate% floor."
            exit 1
          }
          Write-Host "Overall floor ($overallGate%) passed."

          # --- Gate 2: Per-file gate on testable logic layers ---
          # These are the pure/non-Win32 files that MUST be unit-tested.
          # Win32/UI/entry-point files are excluded from this gate because
          # they require a live Windows desktop session.
          # WindowManager.cs is excluded — its pure style-bit math is tested
          # via WindowManagerStyleMathTests, but the Win32 methods
          # (GetExtendedStyle, SetExtendedStyle, ToggleStyle, SetStyle) drag
          # the file-level coverage below the gate.
          $testableFiles = @(
            'AppSettings.cs',
            'RuleEngine.cs',
            'ExclusionTracker.cs',
            'ProcessRule.cs',
            'AppLogger.cs'
          )
          $perFileGate = 70.0
          $failed = $false

          Write-Host ""
          Write-Host "Per-file coverage (testable layers, gate: $perFileGate%):"
          Write-Host "  File                        Line%   Status"
          Write-Host "  ----                        -----   ------"

          foreach ($target in $testableFiles) {
            $class = $xml.SelectNodes("//class") |
              Where-Object { $_.filename -notmatch "obj\\" -and $_.filename -notmatch "\.g\.cs" -and $_.filename -like "*$target" } |
              Select-Object -First 1
            if ($null -eq $class) {
              Write-Host "  $target".PadEnd(30) + "  N/A    SKIP (not found)"
              continue
            }
            $rate = [math]::Round([double]$class.'line-rate' * 100, 1)
            $status = if ($rate -ge $perFileGate) { "PASS" } else { "FAIL" }
            Write-Host ("  {0,-28} {1,5}%  {2}" -f $target, $rate, $status)
            if ($rate -lt $perFileGate) {
              $failed = $true
            }
          }

          if ($failed) {
            Write-Host ""
            Write-Host "::error::One or more testable files are below the $perFileGate% per-file gate."
            exit 1
          }
          Write-Host ""
          Write-Host "All coverage gates passed."

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: ./coverage/**/*cobertura.xml
          if-no-files-found: ignore
          retention-days: 14

  release-build:
    name: Release Build & Publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore (for win-x64 single-file publish)
        run: dotnet restore -r win-x64 src\AltTabExcluder\AltTabExcluder.csproj

      - name: Build (Release)
        run: dotnet build --no-restore -c Release src\AltTabExcluder\AltTabExcluder.csproj

      - name: Publish single-file
        run: dotnet publish --no-restore -c Release -p:PublishProfile=SingleFile src\AltTabExcluder\AltTabExcluder.csproj

  release:
    name: Publish GitHub Release
    # Only runs when a version tag (v*) is pushed. Builds the single-file exe
    # and attaches it to a GitHub Release so the README's "Pre-built binary"
    # link always resolves to a downloadable artifact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, release-build]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: dotnet publish -c Release -p:PublishProfile=SingleFile src\AltTabExcluder\AltTabExcluder.csproj

      - name: Zip publish output
        shell: pwsh
        run: |
          $publishDir = "src\AltTabExcluder\bin\x64\Release\net8.0-windows\win-x64\publish"
          # Exclude .pdb (debug symbols) from the release zip
          Compress-Archive -Path "$publishDir\AltTabExcluder.exe" -DestinationPath "AltTabExcluder-$env:GITHUB_REF_NAME.zip"

      - name: Create release & upload asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag `
            "AltTabExcluder-$tag.zip" `
            --title $tag `
            --generate-notes `
            --verify-tag
